services:

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "50011:8080"
    volumes:
      - ./data/openwebui:/app/backend/data
    environment:
      - WEBUI_AUTH=false
      - OPENAI_API_BASE_URL=http://bifrost:8080/v1
      - OPENAI_API_KEY=sk-secret
    depends_on:
      - bifrost
    restart: always
    networks:
      - llmnet
    mem_limit: 512m

  bifrost:
    image: maximhq/bifrost
    container_name: bifrost
    ports:
      - "50012:8080"
    volumes:
      - ./data/bifrost:/app/db
      - ./config.json:/app/data/config.json
    env_file:
      - .env
    restart: always
    networks:
      - llmnet
    mem_limit: 256m

networks:
  llmnet:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
