services:
  bifrost:
    image: maximhq/bifrost:latest
    volumes:
      - ./data/bifrost:/app/data
    ports:
      - "50012:8080"
    env_file:
      - .env
    restart: always
    container_name: bifrost_app
    networks:
      - llmnet

  prometheus:
    image: prom/prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "50013:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    restart: always
    networks:
      - llmnet

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "50011:8080"
    environment:
      - WEBUI_AUTH=false
      - ENABLE_OLLAMA_API=true
      - OPENAI_API_BASE_URL=http://bifrost:8080/v1
      - OPENAI_API_KEY=sk-bifrost
    depends_on:
      - bifrost
      - open-terminal
    volumes:
      - ./data/openwebui:/app/backend/data
    restart: always
    networks:
      - llmnet

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    restart: unless-stopped
    volumes:
      - ./data/open-terminal:/home/user
    environment:
      - OPEN_TERMINAL_API_KEY=secret
    networks:
      - llmnet

networks:
  llmnet:
    driver: bridge

volumes:
  prometheus_data:
    driver: local